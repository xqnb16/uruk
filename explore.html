<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19140e">
  <title>乌鲁克 · 旅人</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="explore.css">
  <script defer src="assets/journey-v08.bundle.js"></script>
</head>
<body>
  <main id="journey" aria-label="乌鲁克第一人称漫游">
    <div id="viewport"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header class="top">
      <a href="index.html">← <span>乌鲁克全景</span></a>
      <div class="actions">
        <button id="quality" type="button" aria-pressed="true">高画质</button>
        <button id="reset" type="button">回到码头</button>
      </div>
    </header>
    <section class="location" aria-label="所在位置">
      <p id="place" aria-live="polite">运河码头</p>
      <span id="trail">双塔城门在前方</span>
    </section>
    <div id="reticle" aria-hidden="true"></div>
    <div class="controls" aria-label="键盘控制">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 行走</span>
      <span>鼠标转头</span>
      <span><kbd>Shift</kbd> 快走</span>
      <span><kbd>Esc</kbd> 释放鼠标</span>
    </div>
    <div class="touch" aria-label="移动控制">
      <button type="button" data-key="KeyW" aria-label="向前">↑</button>
      <button type="button" data-key="KeyA" aria-label="向左">←</button>
      <button type="button" data-key="KeyS" aria-label="后退">↓</button>
      <button type="button" data-key="KeyD" aria-label="向右">→</button>
    </div>
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <p class="era">苏美尔 · 约公元前 2700 年</p>
      <h1 id="intro-title">乌鲁克</h1>
      <p class="intro-copy">穿过双塔城门，沿主路登上白庙，或者越过木桥去西岸的院落。</p>
      <button id="start" type="button" disabled>正在准备场景</button>
      <a id="fallback" href="index.html" hidden>返回全景</a>
    </section>
    <noscript><p class="no-script">启用 JavaScript 后即可进入乌鲁克。<a href="index.html">返回全景</a></p></noscript>
  </main>
</body>
</html>
