<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17140e">
  <meta name="description" content="从神庙高台望向乌鲁克，再以旅人的视角从运河码头走到双塔城门。">
  <title>乌鲁克 · 入城</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="uruk.css">
  <script src="uruk.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 32 32"><path d="M2 27h28M5 27v-6h22v6M9 21v-6h14v6M12 15V8h8v7M15 8V4h2v4M14 27v-4h4v4"/><path d="M4 15h3m18 0h3"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="full" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="shrink" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4m5 11h-5v5m-11-5h5v5"/></symbol>
    <symbol id="mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13-.5a5 5 0 0 1 0 7m2.8-9.7a8.7 8.7 0 0 1 0 12.4"/></symbol>
    <symbol id="look" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="pan" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4m10-8 4 4-4 4"/></symbol>
  </svg>
  <main class="experience" data-scene="panorama">
    <div class="world" id="world">
      <div class="view current" data-index="0">
        <img class="landscape" src="assets/uruk-v08-overlook.webp" alt="从高处俯瞰乌鲁克，高台神庙的阶梯通向平顶城区和运河。" draggable="false" fetchpriority="high">
        <button class="hotspot" type="button" data-go="1" style="--x:32.5%;--y:78%" aria-label="前往运河码头"><span class="pin"></span><span>运河码头</span></button>
        <button class="hotspot" type="button" data-go="2" style="--x:45.5%;--y:45%" aria-label="前往双塔城门"><span class="pin"></span><span>双塔城门</span></button>
      </div>
      <div class="view" data-index="1" inert aria-hidden="true">
        <img class="landscape" src="assets/uruk-v08-quay.webp" alt="从芦苇船上望向乌鲁克的岸边市集和泥砖城门。" draggable="false">
        <button class="hotspot" type="button" data-go="2" style="--x:63.5%;--y:39%" aria-label="走向双塔城门"><span class="pin"></span><span>双塔城门</span></button>
      </div>
      <div class="view" data-index="2" inert aria-hidden="true">
        <img class="landscape" src="assets/uruk-v08-gate.webp" alt="从旅人眼睛的高度仰望双塔泥砖城门，门洞后可见街市。" draggable="false">
      </div>
    </div>
    <div class="shade" aria-hidden="true"></div>

    <header class="top">
      <button type="button" class="wordmark" data-go="0" aria-label="返回乌鲁克全景">
        <svg aria-hidden="true"><use href="#mark"></use></svg>
        <span>乌鲁克<span class="wordmark-latin" aria-hidden="true">URUK</span></span>
      </button>
      <div class="utilities">
        <button class="tool" type="button" id="audio" aria-pressed="false" aria-label="环境声"><svg aria-hidden="true"><use href="#mute"></use></svg><span>环境声</span></button>
        <button class="tool" type="button" id="look-mode" aria-pressed="false" aria-label="观景模式" title="观景模式"><svg aria-hidden="true"><use href="#look"></use></svg></button>
        <button class="tool" type="button" id="fullscreen" aria-pressed="false" aria-label="全屏"><svg aria-hidden="true"><use href="#full"></use></svg></button>
      </div>
    </header>

    <section class="scene-copy" aria-live="polite" aria-atomic="true">
      <div class="eyebrow"><span class="rule"></span><span id="era">苏美尔 · 约公元前 2700 年</span></div>
      <h1 id="scene-title">乌鲁克</h1>
      <p id="scene-description">神庙高台之下，运河穿过泥砖城区，直抵双塔城门。</p>
      <button class="primary" id="advance" type="button"><span>乘船入城</span><svg aria-hidden="true"><use href="#arrow"></use></svg></button>
    </section>

    <footer class="bottom">
      <div class="route-heading">
        <h2>入城路线</h2>
        <span class="drag-hint"><svg aria-hidden="true"><use href="#pan"></use></svg>拖动环顾</span>
      </div>
      <nav class="route" aria-label="入城路线">
        <button class="stop" type="button" data-go="0" aria-current="step">
          <img src="assets/uruk-v08-overlook.webp" alt="" draggable="false"><span class="stop-copy"><span class="stop-number">01</span><span>城上远望</span></span>
        </button>
        <button class="stop" type="button" data-go="1">
          <img src="assets/uruk-v08-quay.webp" alt="" draggable="false"><span class="stop-copy"><span class="stop-number">02</span><span>运河码头</span></span>
        </button>
        <button class="stop" type="button" data-go="2">
          <img src="assets/uruk-v08-gate.webp" alt="" draggable="false"><span class="stop-copy"><span class="stop-number">03</span><span>双塔城门</span></span>
        </button>
      </nav>
      <p class="credit">吉尔伽美什时代的想象复原</p>
    </footer>
    <p class="notice" id="notice" role="status" hidden></p>
    <noscript><p class="notice">启用 JavaScript 后即可在城中切换视角。</p></noscript>
  </main>
</body>
</html>
